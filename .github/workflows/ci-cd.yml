name: CI/CD - Build, Version and Deploy

on:
  push:
    branches:
      - dev

jobs:
  ci:
    name: CI - Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐞 Debug arquivo VERSION (raw)
        run: |
          echo "Conteúdo bruto do VERSION:"
          cat -A VERSION

      - name: 🧼 Ler versão (sanitizada hard)
        run: |
          VERSION=$(cat VERSION | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Versão final usada: [$VERSION]"

      - name: ✅ Validar formato da versão
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Versão inválida: $VERSION"
            exit 1
          fi
          echo "✔ Versão válida"

      - name: 🔐 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗 Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            171388/lea-api:${{ env.VERSION }}
            171388/lea-api:latest

      - name: ✅ CI concluído
        run: echo "CI finalizado com sucesso"

  cd:
    name: CD - Deploy automático na VM
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: 🚀 Deploy via SSH na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Conectado na VM"
            cd ~/lea-webapi
            docker compose pull
            docker compose up -d
            echo "Deploy finalizado"

      - name: 🎉 CD concluído
        run: echo "Deploy realizado com sucesso"
